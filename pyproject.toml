[project]
name = "agenstra"
version = "0.5.0"
description = "Agenstra: a domain-neutral ReAct runtime with independently imported capabilities."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2", "jsonschema>=4.23,<5"]
server = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[project.scripts]
agenstra = "agenstra.cli:main"
agenstra-serve = "agenstra.serve:main"
agenstra-import-openapi = "agenstra.openapi:main"
agenstra-manage = "agenstra.manage_cli:main"

[dependency-groups]
dev = [
  "fastapi>=0.116,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenstra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["agenstra"]
