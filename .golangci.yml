version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - govet
    - ineffassign
    - nolintlint
    - staticcheck
  settings:
    staticcheck:
      # Correctness checks; stylistic rewrites require a separate justification.
      checks: ["SA*"]
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    # Do not silently suppress diagnostics in tests or common helper code.
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
