name: Go
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json
      - run: npm ci --prefix sdk/web
      - run: npm run lint --prefix sdk/web
      - run: npm test --prefix sdk/web
